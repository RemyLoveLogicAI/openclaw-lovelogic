[profile.default]
src = "contracts"
out = "out"
test = "test"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

[profile.default.dependencies]
openzeppelin = { version = "5.0", url = "https://github.com/OpenZeppelin/openzeppelin-contracts" }
forge_std = { url = "https://github.com/foundry-rs/forge-std" }
