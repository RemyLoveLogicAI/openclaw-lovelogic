name: Deploy Worker (Cloudflare)

# PRs: typecheck + unit tests + `wrangler deploy --dry-run` (no Cloudflare credentials needed).
# Push to main: the same checks, then a real deploy, but only when the repository
# secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID both exist. Without them
# the deploy job logs a notice and skips instead of failing.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "packages/worker/**"
      - "packages/memory-kernel/src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Worker typecheck, tests, dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck worker
        run: pnpm --filter @openclaw-lovelogic/worker typecheck

      - name: Unit tests
        run: pnpm --filter @openclaw-lovelogic/worker test

      - name: wrangler deploy --dry-run
        run: pnpm --filter @openclaw-lovelogic/worker exec wrangler deploy --dry-run --outdir dist

  deploy:
    name: Deploy openclaw-deploy Worker
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-cloudflare-worker
      cancel-in-progress: false
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable deploys."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'

      - name: Set up pnpm
        if: steps.secrets.outputs.present == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.secrets.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare
        if: steps.secrets.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/worker
          packageManager: pnpm
          command: deploy
